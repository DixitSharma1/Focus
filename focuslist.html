<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FocusList</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0F1729;
    --surface:   #161F35;
    --surface2:  #1E2A42;
    --border:    #2A3A5C;
    --text:      #E8EEFF;
    --muted:     #6B7FA8;
    --accent:    #6366F1;
    --accent-glow: rgba(99,102,241,0.18);
    --high:      #F59E0B;
    --med:       #6366F1;
    --low:       #10B981;
    --danger:    #F43F5E;
    --done-text: #4A5B80;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    line-height: 1.5;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ── LAYOUT ── */
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 14px; color: #fff;
  }
  .logo-name { font-size: 18px; font-weight: 700; letter-spacing: -0.03em; }
  .logo-name span { color: var(--accent); }
  .header-date { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  main {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 0;
    flex: 1;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 20px;
    align-items: start;
  }
  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; padding: 16px 12px; }
  }

  /* ── SIDEBAR ── */
  .sidebar { position: sticky; top: 88px; padding-right: 24px; }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
  }
  .stat-card.total { grid-column: span 2; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-value.total-v { color: var(--text); }
  .stat-value.done-v  { color: var(--low); }
  .stat-value.pend-v  { color: var(--high); }

  .section-label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 8px; padding-left: 2px;
  }
  .filter-group { margin-bottom: 20px; }
  .filter-btn {
    display: block; width: 100%;
    background: none; border: none; cursor: pointer;
    text-align: left; color: var(--muted);
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    padding: 7px 12px; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
  }
  .filter-btn:hover { background: var(--surface2); color: var(--text); }
  .filter-btn.active { background: var(--accent-glow); color: var(--accent); }
  .filter-btn .dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-right: 8px; vertical-align: middle;
  }
  .dot-all   { background: var(--muted); }
  .dot-high  { background: var(--high); }
  .dot-med   { background: var(--med); }
  .dot-low   { background: var(--low); }

  @media (max-width: 780px) {
    .sidebar { position: static; padding-right: 0; margin-bottom: 20px; }
    .sidebar { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .stats-block { grid-column: span 2; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-row .filter-btn { width: auto; }
  }

  /* ── MAIN PANEL ── */
  .panel { flex: 1; }

  .add-form {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .add-input {
    flex: 1; min-width: 180px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 16px;
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .add-input:focus { border-color: var(--accent); }
  .add-input::placeholder { color: var(--muted); }

  .prio-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--text); outline: none; cursor: pointer;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
    min-width: 110px;
  }
  .prio-select:focus { border-color: var(--accent); }
  .prio-select option { background: var(--surface); }

  .add-btn {
    background: var(--accent); border: none; border-radius: 10px;
    color: #fff; font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600; padding: 11px 20px;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .add-btn:hover { opacity: 0.88; }
  .add-btn:active { transform: scale(0.97); }

  .search-bar {
    position: relative; margin-bottom: 16px;
  }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; font-size: 14px;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px 10px 40px;
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text);
    outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .status-tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border); padding-bottom: 0;
  }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    color: var(--muted); padding: 8px 16px 10px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── TASKS ── */
  .task-list { display: flex; flex-direction: column; gap: 8px; }

  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 12px;
    border-left: 3px solid transparent;
    transition: border-color 0.15s, background 0.15s;
  }
  .task-item:hover { background: var(--surface2); }
  .task-item[data-priority="High"]   { border-left-color: var(--high); }
  .task-item[data-priority="Medium"] { border-left-color: var(--med);  }
  .task-item[data-priority="Low"]    { border-left-color: var(--low);  }
  .task-item.done { opacity: 0.6; }
  .task-item.done .task-title { text-decoration: line-through; color: var(--done-text); }

  .check-btn {
    width: 20px; height: 20px; min-width: 20px;
    border-radius: 6px; border: 2px solid var(--border);
    background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, background 0.15s;
    margin-top: 1px;
  }
  .check-btn:hover { border-color: var(--low); }
  .check-btn.checked { background: var(--low); border-color: var(--low); }
  .check-btn .tick { color: #fff; font-size: 11px; display: none; }
  .check-btn.checked .tick { display: block; }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; font-weight: 500; word-break: break-word; }
  .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
  .priority-badge {
    font-size: 10px; font-weight: 600; padding: 2px 8px;
    border-radius: 20px; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }
  .badge-High   { background: rgba(245,158,11,.15); color: var(--high); }
  .badge-Medium { background: rgba(99,102,241,.15);  color: var(--med);  }
  .badge-Low    { background: rgba(16,185,129,.15);  color: var(--low);  }

  .task-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 4px;
    border-radius: 6px; font-size: 14px;
    transition: color 0.15s, background 0.15s;
    line-height: 1;
  }
  .icon-btn:hover { background: var(--surface2); }
  .icon-btn.edit:hover { color: var(--accent); }
  .icon-btn.del:hover  { color: var(--danger); }

  /* ── EDIT INLINE ── */
  .task-edit-input {
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 6px; padding: 4px 10px;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
    color: var(--text); outline: none; width: 100%;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-msg  { font-size: 14px; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <div class="logo-mark">FL</div>
      <div class="logo-name">Focus<span>List</span></div>
    </div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <main>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="stats-block">
        <div class="stats-grid">
          <div class="stat-card total">
            <div class="stat-label">Total Tasks</div>
            <div class="stat-value total-v" id="statTotal">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Completed</div>
            <div class="stat-value done-v" id="statDone">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pending</div>
            <div class="stat-value pend-v" id="statPend">0</div>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <div class="section-label">Priority</div>
        <div class="filter-row">
          <button class="filter-btn active" data-prio="All" onclick="setPrioFilter(this)">
            <span class="dot dot-all"></span>All Priorities
          </button>
          <button class="filter-btn" data-prio="High" onclick="setPrioFilter(this)">
            <span class="dot dot-high"></span>High
          </button>
          <button class="filter-btn" data-prio="Medium" onclick="setPrioFilter(this)">
            <span class="dot dot-med"></span>Medium
          </button>
          <button class="filter-btn" data-prio="Low" onclick="setPrioFilter(this)">
            <span class="dot dot-low"></span>Low
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN PANEL -->
    <section class="panel">
      <!-- Add Task -->
      <div class="add-form">
        <input class="add-input" id="taskInput" type="text" placeholder="What do you need to focus on?" maxlength="200" />
        <select class="prio-select" id="prioSelect">
          <option value="Medium">⬤ Medium</option>
          <option value="High">⬤ High</option>
          <option value="Low">⬤ Low</option>
        </select>
        <button class="add-btn" onclick="addTask()">+ Add Task</button>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <span class="search-icon">&#128269;</span>
        <input class="search-input" id="searchInput" type="text" placeholder="Search tasks…" oninput="render()" />
      </div>

      <!-- Status Tabs -->
      <div class="status-tabs">
        <button class="tab-btn active" data-status="All"       onclick="setStatusFilter(this)">All</button>
        <button class="tab-btn"        data-status="Active"    onclick="setStatusFilter(this)">Active</button>
        <button class="tab-btn"        data-status="Completed" onclick="setStatusFilter(this)">Completed</button>
      </div>

      <!-- Task List -->
      <div class="task-list" id="taskList"></div>
    </section>
  </main>
</div>

<script>
  // ── STATE ──
  let tasks = JSON.parse(localStorage.getItem('focuslist_tasks') || '[]');
  let statusFilter = 'All';
  let prioFilter   = 'All';

  function save() { localStorage.setItem('focuslist_tasks', JSON.stringify(tasks)); }

  // ── DATE ──
  (function() {
    const d = new Date();
    document.getElementById('headerDate').textContent =
      d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  })();

  // ── ADD ──
  function addTask() {
    const input = document.getElementById('taskInput');
    const title = input.value.trim();
    if (!title) { input.focus(); return; }
    const prio = document.getElementById('prioSelect').value;
    tasks.unshift({ id: Date.now(), title, priority: prio, done: false });
    save(); render();
    input.value = '';
    input.focus();
  }
  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // ── TOGGLE ──
  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  // ── DELETE ──
  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }

  // ── EDIT ──
  function startEdit(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const titleEl = document.querySelector(`[data-id="${id}"] .task-title`);
    if (!titleEl) return;
    const input = document.createElement('input');
    input.className = 'task-edit-input';
    input.value = t.title;
    titleEl.replaceWith(input);
    input.focus();
    input.select();
    function commit() {
      const v = input.value.trim();
      if (v) t.title = v;
      save(); render();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { input.blur(); }
      if (e.key === 'Escape') { input.removeEventListener('blur', commit); render(); }
    });
  }

  // ── FILTERS ──
  function setStatusFilter(btn) {
    statusFilter = btn.dataset.status;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }
  function setPrioFilter(btn) {
    prioFilter = btn.dataset.prio;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  // ── RENDER ──
  function render() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    let visible = tasks.filter(t => {
      if (statusFilter === 'Active'    && t.done)  return false;
      if (statusFilter === 'Completed' && !t.done) return false;
      if (prioFilter !== 'All' && t.priority !== prioFilter) return false;
      if (query && !t.title.toLowerCase().includes(query)) return false;
      return true;
    });

    // Stats (always from full tasks)
    const total = tasks.length;
    const done  = tasks.filter(t => t.done).length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statDone').textContent  = done;
    document.getElementById('statPend').textContent  = total - done;

    const list = document.getElementById('taskList');

    if (visible.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">✦</div>
          <div class="empty-msg">${tasks.length === 0 ? 'Add your first task above.' : 'No tasks match your filters.'}</div>
        </div>`;
      return;
    }

    list.innerHTML = visible.map(t => `
      <div class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}" data-priority="${t.priority}">
        <button class="check-btn ${t.done ? 'checked' : ''}" onclick="toggleTask(${t.id})" aria-label="${t.done ? 'Mark incomplete' : 'Mark complete'}">
          <span class="tick">✓</span>
        </button>
        <div class="task-body">
          <div class="task-title">${escHtml(t.title)}</div>
          <div class="task-meta">
            <span class="priority-badge badge-${t.priority}">${t.priority}</span>
          </div>
        </div>
        <div class="task-actions">
          <button class="icon-btn edit" onclick="startEdit(${t.id})" aria-label="Edit task" title="Edit">✎</button>
          <button class="icon-btn del"  onclick="deleteTask(${t.id})" aria-label="Delete task" title="Delete">✕</button>
        </div>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
